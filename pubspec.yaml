name: solvhen
description: Solvhen - A growing presence
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  dio: ^5.4.0
  webview_flutter: ^4.4.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/skills/
    - assets/personality/
    - assets/avatars/
