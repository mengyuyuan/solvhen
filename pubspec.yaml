name: solvhen
description: Solvhen - A growing presence
publish_to: 'none'
version: 2.2.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  dio: ^5.4.0
  webview_flutter: ^4.4.0
  file_picker: ^8.0.0
  flutter_local_notifications: ^21.0.0
  permission_handler: ^11.0.0
  flutter_tts: ^4.0.0
  speech_to_text: ^7.0.0
  record: ^5.0.0
  audioplayers: ^6.0.0
  open_filex: ^4.5.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
  workmanager: ^0.10.7
  flutter_foreground_task: ^10.0.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2

dependency_overrides:
  record_platform_interface: 1.0.0

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/skills/
    - assets/personality/
    - assets/avatars/
