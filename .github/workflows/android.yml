name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest tool/test_rebuild_server.py
      - name: Configure ephemeral CI signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/app/ci-release.jks \
            -storepass android -keypass android -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Solvhen CI,O=Solvhen,C=CN"
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=ci\nstoreFile=app/ci-release.jks\n' \
            > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: solvhen-android-release-ci
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
